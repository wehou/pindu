<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<!-- 单文件离线版：所有 JS/CSS 已内联，双击即可打开 -->
<title>Phonics Quest · 自然拼读 10 阶段闯关（5 天计划）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;800&family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef2ff; --bg2:#f7f8ff; --card:#ffffff; --ink:#1e2340; --ink2:#5b6488; --line:#e6e9f5;
  --brand:#5b5bd6; --brand2:#7c74f0; --ok:#12b981; --bad:#ef4444; --warn:#f59e0b; --pink:#ec4899;
  --r:18px; --sh:0 6px 20px rgba(60,70,140,.10); --sh2:0 14px 40px rgba(60,70,140,.18);
  --ipa:"Noto Sans","Noto Sans IPA","DejaVu Sans","Segoe UI","Lucida Sans Unicode","Arial Unicode MS",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:var(--ipa);
  color:var(--ink);
  background:
    radial-gradient(1200px 600px at 15% -10%, #dfe6ff 0%, transparent 60%),
    radial-gradient(900px 500px at 100% 0%, #ffe6f1 0%, transparent 55%),
    var(--bg2);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
h1,h2,h3,h4{margin:0;line-height:1.25}
.ipa{font-family:var(--ipa)}

/* ---------- topbar ---------- */
.topbar{
  position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;
  gap:10px;padding:10px 14px;background:rgba(255,255,255,.78);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:10px}
.brand-txt b{display:block;font-size:16px;letter-spacing:.2px}
.brand-txt small{display:block;font-size:11px;color:var(--ink2)}
.logo{
  width:36px;height:36px;border-radius:12px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;font-weight:800;font-size:14px;
  box-shadow:0 4px 12px rgba(91,91,214,.35)
}
.top-actions{display:flex;gap:6px;position:relative}
.icon-btn{
  width:40px;height:40px;border-radius:12px;background:#fff;border:1px solid var(--line);
  display:grid;place-items:center;box-shadow:var(--sh);transition:.15s;
  font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji","Segoe UI Symbol",sans-serif
}
.icon-btn:active{transform:scale(.92)}
.icon-btn.off{opacity:.42}
.badge{
  position:absolute;top:-4px;right:-4px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;
  background:var(--bad);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;border:2px solid #fff
}

/* ---------- layout ---------- */
main{max-width:860px;margin:0 auto;padding:16px 14px 60px}
.view{animation:fade .28s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hero{padding:14px 4px 18px}
.hero h1{font-size:26px;letter-spacing:-.4px}
.hero p{margin:8px 0 0;color:var(--ink2);font-size:14px;line-height:1.6}
.sec-title{display:flex;align-items:center;justify-content:space-between;margin:22px 2px 10px}
.sec-title h3{font-size:15px}
.sec-title span{font-size:12px;color:var(--ink2)}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:16px}

/* ---------- 每日计划 ---------- */
.plan{display:grid;gap:8px}
.plan-row{
  display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:#fbfcff;border:1px solid var(--line)
}
.plan-row.done{background:#ecfdf5;border-color:#a7f3d0}
.plan-time{
  flex:0 0 auto;width:52px;text-align:center;font-size:12px;font-weight:800;color:var(--brand);
  background:#eef0ff;border-radius:10px;padding:6px 0
}
.plan-row.done .plan-time{background:#d1fae5;color:var(--ok)}
.plan-body{flex:1;min-width:0}
.plan-body b{font-size:14px}
.plan-body p{margin:3px 0 0;font-size:12px;color:var(--ink2);line-height:1.5}
.plan-go{flex:0 0 auto}
.mini-btn{
  padding:7px 12px;border-radius:10px;background:var(--brand);color:#fff;font-size:12px;font-weight:700;box-shadow:0 4px 10px rgba(91,91,214,.28)
}
.mini-btn.ghost{background:#fff;color:var(--brand);border:1px solid #d8dcff;box-shadow:none}
.timer-num{font-variant-numeric:tabular-nums;font-weight:800;color:var(--warn)}

/* ---------- chips ---------- */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;-webkit-overflow-scrolling:touch}
.chip{
  flex:0 0 auto;padding:8px 13px;border-radius:999px;background:#fff;border:1px solid var(--line);
  font-size:13px;font-weight:600;color:var(--ink2);box-shadow:var(--sh);transition:.15s
}
.chip.on{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border-color:transparent;box-shadow:0 6px 16px rgba(91,91,214,.3)}
.chip small{opacity:.75;font-weight:500;margin-left:5px}

/* ---------- mode grid ---------- */
.modes{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(max-width:520px){.modes{grid-template-columns:1fr}}
.mode{
  position:relative;text-align:left;padding:16px;border-radius:var(--r);border:1px solid var(--line);
  background:var(--card);box-shadow:var(--sh);transition:.18s;overflow:hidden
}
.mode:hover{transform:translateY(-3px);box-shadow:var(--sh2)}
.mode:active{transform:scale(.985)}
.mode .emo{font-size:26px}
.mode h4{margin:8px 0 4px;font-size:15px}
.mode p{margin:0;font-size:12px;color:var(--ink2);line-height:1.55}
.mode .step{
  position:absolute;top:12px;right:12px;font-size:10px;font-weight:800;color:var(--brand);
  background:#eef0ff;border-radius:6px;padding:3px 6px
}
.mode .best{margin-top:10px;font-size:11px;color:var(--warn);font-weight:700}

/* ---------- game ---------- */
.game-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.back{width:34px;height:34px;border-radius:11px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;font-size:15px}
.grow{flex:1;min-width:0}
.bar{height:8px;border-radius:99px;background:#e8ebf8;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--brand),var(--brand2));transition:width .35s}
.hud{display:flex;align-items:center;gap:14px;font-size:12px;color:var(--ink2);font-weight:700}
.hud b{color:var(--ink);font-size:14px}
.combo{color:var(--warn)}

.qbar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.qtype{font-size:11px;font-weight:800;padding:4px 9px;border-radius:8px;background:#eef0ff;color:var(--brand)}
.timer{height:6px;flex:1;border-radius:99px;background:#e8ebf8;overflow:hidden}
.timer>i{display:block;height:100%;background:linear-gradient(90deg,#22d3ee,var(--brand));width:100%}
.timer.low>i{background:linear-gradient(90deg,#fb7185,var(--bad))}

.prompt{text-align:center;padding:18px 10px}
.prompt .big{font-size:30px;font-weight:800;letter-spacing:.5px}
.prompt .sub{margin-top:8px;font-size:13px;color:var(--ink2)}
.prompt .hl-word{font-size:40px;font-weight:800;letter-spacing:1px}
.hl{background:linear-gradient(transparent 62%, #ffe08a 62%);border-radius:3px;padding:0 1px}
.listen-btn{
  margin-top:12px;padding:11px 20px;border-radius:999px;background:linear-gradient(135deg,var(--brand),var(--brand2));
  color:#fff;font-weight:800;font-size:14px;box-shadow:0 6px 18px rgba(91,91,214,.32);display:inline-flex;align-items:center;gap:8px
}
.listen-btn:active{transform:scale(.95)}

.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:6px}
.opts.one{grid-template-columns:1fr}
.opt{
  padding:16px 12px;border-radius:14px;background:#fff;border:1.5px solid var(--line);font-size:17px;font-weight:700;
  text-align:center;box-shadow:var(--sh);transition:.15s;min-height:62px;display:grid;place-items:center;gap:2px
}
.opt small{display:block;font-size:11px;font-weight:500;color:var(--ink2);margin-top:2px}
.opt:active{transform:scale(.97)}
.opt.ok{background:#ecfdf5;border-color:var(--ok);color:#047857;animation:pop .3s}
.opt.bad{background:#fef2f2;border-color:var(--bad);color:#b91c1c;animation:shake .35s}
.opt.dim{opacity:.35}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.05)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

.tip{margin-top:14px;padding:12px 14px;border-radius:14px;background:#fffbeb;border:1px solid #fde68a;font-size:13px;line-height:1.6}
.tip.ok{background:#ecfdf5;border-color:#a7f3d0}
.tip b{color:#b45309}
.tip.ok b{color:#047857}

/* ---------- 重音 ---------- */
.syls{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:18px 0}
.syl{
  padding:14px 16px;border-radius:14px;background:#fff;border:1.5px solid var(--line);font-size:19px;font-weight:800;
  box-shadow:var(--sh);transition:.15s
}
.syl:active{transform:scale(.94)}
.syl.ok{background:#ecfdf5;border-color:var(--ok);color:#047857;animation:pop .3s}
.syl.bad{background:#fef2f2;border-color:var(--bad);color:#b91c1c;animation:shake .35s}
.syl.soft{border-style:dashed;opacity:.9}

/* ---------- 拼词 ---------- */
.slots{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:14px 0 6px}
.slot{
  min-width:52px;height:56px;border-radius:12px;border:2px dashed #cfd5f5;background:#fff;
  display:grid;place-items:center;font-size:19px;font-weight:800;color:var(--ink)
}
.slot small{display:block;font-size:10px;font-weight:600;color:var(--ink2);margin-top:-2px}
.slot.filled{border-style:solid;border-color:var(--brand);background:#f3f4ff}
.blocks{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:14px}
.blk{
  min-width:46px;padding:12px 14px;border-radius:12px;background:#fff;border:1.5px solid var(--line);
  font-size:18px;font-weight:800;box-shadow:var(--sh);transition:.15s
}
.blk:active{transform:scale(.93)}
.blk.used{opacity:.25;pointer-events:none}
.blk.wrong{background:#fef2f2;border-color:var(--bad);animation:shake .35s}

/* ---------- 配对 ---------- */
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
@media(max-width:520px){.mgrid{grid-template-columns:repeat(3,1fr)}}
.mc{
  aspect-ratio:1/1;border-radius:14px;background:#fff;border:1.5px solid var(--line);display:grid;place-items:center;
  font-weight:800;font-size:15px;box-shadow:var(--sh);transition:.18s;text-align:center;padding:4px;overflow:hidden
}
.mc .ipa{font-size:17px}
.mc.sel{background:#eef0ff;border-color:var(--brand);transform:translateY(-2px)}
.mc.gone{opacity:0;transform:scale(.6);pointer-events:none;transition:.3s}
.mc.hit{background:#ecfdf5;border-color:var(--ok)}
.mc.miss{animation:shake .35s;border-color:var(--bad)}

/* ---------- 结果 ---------- */
.result{text-align:center;padding:20px 10px}
.score{font-size:56px;font-weight:800;letter-spacing:-1px;background:linear-gradient(135deg,var(--brand),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.result .meta{margin:6px 0 18px;color:var(--ink2);font-size:13px}
.acc{margin-top:18px;text-align:left}
.acc h4{font-size:13px;margin-bottom:8px}
.acc-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 12px;border-radius:11px;background:#fbfcff;border:1px solid var(--line);margin-bottom:6px;font-size:13px}
.acc-item .no{color:var(--bad);font-weight:800}
.acc-item .yes{color:var(--ok);font-weight:800}

/* ---------- 音素卡 ---------- */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.pc{
  padding:12px 8px;border-radius:14px;background:#fff;border:1.5px solid var(--line);text-align:center;
  box-shadow:var(--sh);transition:.15s
}
.pc:active{transform:scale(.95)}
.pc .s{font-size:22px;font-weight:800;color:var(--brand)}
.pc .l{font-size:11px;color:var(--ink2);margin-top:2px}
.pc.on{border-color:var(--brand);background:#f3f4ff}
.mouth-wrap{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:6px 0 4px}
.mouth-box{text-align:center}
.mouth-box svg{display:block;margin:0 auto}
.mouth-cap{font-size:12px;color:var(--ink2);margin-top:2px}
.gauge{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--ink2);margin-top:8px}
.gauge .g{flex:1;height:6px;border-radius:99px;background:#e8ebf8;overflow:hidden}
.gauge .g>i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2));border-radius:99px}
.wlist{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;justify-content:center}
.wchip{
  padding:8px 12px;border-radius:12px;background:#fff;border:1px solid var(--line);font-weight:700;font-size:14px;
  box-shadow:var(--sh);display:flex;flex-direction:column;align-items:center;gap:2px
}
.wchip small{font-size:10px;font-weight:500;color:var(--ink2)}
.wchip .cmb{color:var(--pink);font-weight:800}

/* ---------- 录音 ---------- */
.rec{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:14px}
.rec-btn{
  width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#fb7185,var(--bad));color:#fff;font-size:22px;
  box-shadow:0 8px 20px rgba(239,68,68,.35);display:grid;place-items:center
}
.rec-btn.recording{animation:pulse 1s infinite}
@keyframes pulse{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(239,68,68,.5)}50%{transform:scale(1.06);box-shadow:0 0 0 12px rgba(239,68,68,0)}}
.rec audio{max-width:100%}

/* ---------- modal ---------- */
.mask{position:fixed;inset:0;background:rgba(24,28,56,.5);backdrop-filter:blur(3px);z-index:60;display:grid;place-items:center;padding:16px;animation:fade .2s}
.modal{
  width:100%;max-width:560px;max-height:82vh;overflow:auto;background:#fff;border-radius:22px;padding:20px;
  box-shadow:0 30px 70px rgba(20,25,60,.35);animation:rise .26s
}
@keyframes rise{from{transform:translateY(24px) scale(.97);opacity:0}to{transform:none;opacity:1}}
.modal h3{font-size:17px;margin-bottom:4px}
.modal .sub{font-size:12px;color:var(--ink2);margin-bottom:14px}
.modal-close{position:sticky;top:0;float:right;margin:-6px -6px 0 0;width:30px;height:30px;border-radius:9px;background:#f1f3fb;font-size:14px}
.steps{counter-reset:s}
.step{position:relative;padding:0 0 16px 34px;border-left:2px dashed #e0e4f7;margin-left:11px}
.step:last-child{border-left-color:transparent;padding-bottom:0}
.step:before{
  counter-increment:s;content:counter(s);position:absolute;left:-13px;top:0;width:26px;height:26px;border-radius:50%;
  background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;font-size:12px;font-weight:800;display:grid;place-items:center
}
.step h4{font-size:14px}
.step p{margin:6px 0 0;font-size:13px;color:var(--ink2);line-height:1.65}
.step code{background:#f1f3fb;padding:1px 6px;border-radius:6px;font-size:12px}
.rowline{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.rowline:last-child{border-bottom:0}
.rowline .k{font-size:13px}
.rowline .k small{display:block;color:var(--ink2);font-size:11px;margin-top:2px}
.toggle{width:46px;height:26px;border-radius:99px;background:#dfe3f2;position:relative;transition:.2s;flex:0 0 auto}
.toggle:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle.on{background:var(--brand)}
.toggle.on:after{transform:translateX(20px)}
.seg{display:flex;gap:6px}
.seg button{padding:6px 12px;border-radius:9px;background:#f1f3fb;font-size:12px;font-weight:700;color:var(--ink2)}
.seg button.on{background:var(--brand);color:#fff}

.empty{text-align:center;padding:26px 10px;color:var(--ink2);font-size:13px}
.btn-row{display:flex;gap:10px;margin-top:18px}
.btn{
  flex:1;padding:14px;border-radius:14px;font-weight:800;font-size:15px;text-align:center;transition:.15s
}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;box-shadow:0 8px 20px rgba(91,91,214,.3)}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink);box-shadow:var(--sh)}

/* ---------- fx ---------- */
#fx-root{position:fixed;inset:0;pointer-events:none;z-index:80;overflow:hidden}
.cf{position:absolute;width:9px;height:14px;border-radius:2px;animation:fall 1.5s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:0}}
.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:rgba(30,35,64,.94);color:#fff;
  padding:11px 18px;border-radius:12px;font-size:13px;z-index:90;animation:rise .2s;box-shadow:0 10px 30px rgba(0,0,0,.3)
}


/* ================= 阶段化布局（新增） ================= */
.totalrow{display:flex;align-items:center;gap:14px}
.totalrow .grow{flex:1;min-width:0}

/* ---------- 5 天计划 ---------- */
.days{display:grid;gap:12px}
.daycard{
  text-align:left;padding:14px 16px;border-radius:var(--r);background:var(--card);
  border:1.5px solid var(--line);box-shadow:var(--sh);transition:.18s
}
.daycard.on{border-color:var(--brand);box-shadow:0 10px 26px rgba(91,91,214,.16)}
.daycard.done{background:#f5fdf9}
.daycard:active{transform:scale(.99)}
.day-top{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.day-no{font-size:11px;font-weight:800;color:var(--brand);background:#eef0ff;border-radius:8px;padding:3px 8px}
.day-emo{font-size:20px}
.day-flag{margin-left:auto;color:var(--ok);font-weight:800}
.daycard b{font-size:15px}
.daycard p{margin:4px 0 8px;font-size:12px;color:var(--ink2);line-height:1.55}
.day-stages{display:flex;flex-wrap:wrap;gap:6px}
.smini{
  padding:6px 10px;border-radius:10px;background:#f6f7fd;border:1px solid var(--line);
  font-size:12px;font-weight:700;display:flex;align-items:center;gap:6px
}
.smini small{color:var(--ink2);font-weight:600}
.smini.done{background:#ecfdf5;border-color:#a7f3d0;color:#047857}
.day-foot{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--ink2);margin-top:6px}
.day-warm{font-size:11px;color:var(--ink2);margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}

/* ---------- 阶段列表 ---------- */
.stagelist{display:grid;gap:8px}
.stagerow{
  display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--card);
  border:1px solid var(--line);box-shadow:var(--sh);text-align:left;transition:.15s
}
.stagerow:active{transform:scale(.99)}
.stagerow .sr-no{font-size:20px;flex:0 0 auto}
.stagerow .sr-body{flex:1;min-width:0}
.stagerow .sr-body b{display:block;font-size:14px}
.stagerow .sr-body small{display:block;font-size:11px;color:var(--ink2);margin-top:2px}
.stagerow .sr-ring{flex:0 0 auto;font-size:12px;font-weight:800;color:var(--brand);
  background:#eef0ff;border-radius:99px;padding:5px 10px;min-width:44px;text-align:center}
.stagerow.done{background:#f5fdf9}
.stagerow.done .sr-ring{background:#d1fae5;color:#047857}

/* ---------- 阶段页 ---------- */
.tabs{display:flex;gap:6px;background:#eef0f9;padding:5px;border-radius:14px;margin-bottom:14px}
.tab{
  flex:1;padding:10px 6px;border-radius:10px;font-size:13px;font-weight:800;color:var(--ink2);transition:.15s
}
.tab.on{background:#fff;color:var(--brand);box-shadow:0 2px 8px rgba(60,70,140,.12)}

.card.goal p{margin:10px 0 0;font-size:14px;line-height:1.7}
.card.chant p{margin:10px 0 0;font-size:19px;font-weight:800;line-height:1.5;color:var(--brand)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){.two{grid-template-columns:1fr}}
ul.tips{margin:10px 0 0;padding-left:18px}
ul.tips li{font-size:13px;color:var(--ink2);line-height:1.7;margin-bottom:4px}

.stage-nav{display:flex;justify-content:space-between;margin:18px 0 6px}

/* ---------- 知识点卡（学一学） ---------- */
.kpbox{border:1px solid var(--line);border-radius:14px;background:#fff;box-shadow:var(--sh);overflow:hidden}
.kpbox.on{border-color:var(--brand)}
.kphead{
  width:100%;display:flex;align-items:center;gap:10px;padding:12px 14px;text-align:left;flex-wrap:wrap
}
.kp-ipa{font-size:19px;font-weight:800;color:var(--brand);min-width:52px}
.kp-name{flex:1;min-width:120px;font-size:13px;font-weight:700}
.kp-cmb{display:flex;gap:4px;flex-wrap:wrap}
.kp-cmb code{background:#f6f7fd;border:1px solid var(--line);border-radius:6px;padding:2px 7px;font-size:12px;color:var(--pink);font-weight:800}
.kp-ar{flex:0 0 auto;width:22px;text-align:center;color:var(--ink2);font-weight:800}
.kpbody{padding:0 14px 14px;border-top:1px dashed var(--line)}
.lk{background:none;padding:0;font-size:inherit;color:inherit;text-decoration:underline;text-decoration-style:dotted}

/* ---------- 规则表 ---------- */
.rtable{display:grid;gap:8px}
.rrow{
  display:flex;gap:12px;padding:11px 13px;border-radius:12px;background:#fff;
  border:1px solid var(--line);box-shadow:var(--sh)
}
.rrow .rname{flex:0 0 118px}
.rrow .rname b{display:block;font-size:13px}
.rrow .rname small{display:block;font-size:11px;color:var(--ink2);margin-top:2px}
.rrow .rbody{flex:1;min-width:0;font-size:12px;color:var(--ink);line-height:1.6}
.rrow .rbody small{color:var(--ink2);font-size:11px}
@media(max-width:520px){.rrow{flex-direction:column;gap:4px}.rrow .rname{flex:none}}

/* ---------- 关卡列表（练一练） ---------- */
.lvlist{display:grid;gap:10px}
.lvrow{
  display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:14px;background:#fff;
  border:1px solid var(--line);box-shadow:var(--sh)
}
.lvrow.done{background:#f5fdf9;border-color:#a7f3d0}
.lv-main{flex:1;min-width:0}
.lv-top{display:flex;align-items:center;gap:8px}
.lv-top b{font-size:14px}
.lv-n{font-size:11px;font-weight:800;color:var(--brand);background:#eef0ff;border-radius:8px;padding:2px 8px}
.lv-sub{font-size:11px;color:var(--ink2);margin-top:5px;line-height:1.5}
.lv-pts{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.lv-pts .pt{
  font-size:11px;padding:3px 8px;border-radius:7px;background:#f6f7fd;border:1px solid var(--line);color:var(--ink2)
}
.lv-pts .pt.mid{background:#fffbeb;border-color:#fde68a;color:#b45309}
.lv-pts .pt.ok{background:#ecfdf5;border-color:#a7f3d0;color:#047857}

/* ---------- 题目里的音素串 ---------- */
.snds{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px;margin:14px 0 4px}
.snd{font-size:20px;font-weight:800;color:var(--brand);background:#eef0ff;border-radius:10px;padding:8px 12px}
.snds .plus{color:var(--ink2);font-weight:800}
.rulebox{
  margin:10px 0;padding:14px;border-radius:14px;background:#f6f7fd;border:1px dashed #cfd5f5;
  font-size:14px;line-height:1.7;text-align:center
}

/* ---------- 说明弹窗 ---------- */
.mdoc h4{font-size:14px;margin:16px 0 6px}
.mdoc h4:first-child{margin-top:0}
.mdoc p{margin:0;font-size:13px;color:var(--ink2);line-height:1.75}

   ========================================================================= */

/* ---------- 知识点构造helper ---------- */
function LPT(l) { const x = LETTER_SOUNDS.find(y => y.l === l); return { kind: 'letter', id: 'L:' + l, n: 2, grp: '第 ' + x.batch + ' 批', ...x }; }
function PPT(ipa) { const p = BY_IPA[ipa]; if (!p) throw new Error('缺音素 ' + ipa); return { kind: 'ph', id: 'P:' + ipa, n: 2, ...p }; }
function TPT(id) { const p = PH_PAT.find(x => x.id === id); if (!p) throw new Error('缺模式 ' + id); return { ...p, kind: 'ph', id: 'T:' + id, n: 2 }; }
function BPT(w) { const x = CVC_WORDS.find(y => y.w === w); return { kind: 'blend', id: 'B:' + w, n: 1, label: '拼读 ' + w, ...x }; }
function CPT(w) { const x = CCVC_WORDS.find(y => y.w === w); return { kind: 'blend', id: 'C:' + w, n: 1, label: '拼读 ' + w, ...x }; }

<script>
/* Phonics Quest — 交互逻辑 */

/* ================= 基础工具 ================= */
/* =========================================================================
   Phonics Quest — 阶段化学习系统（交互逻辑）
   ========================================================================= */

/* ================= 基础工具 ================= */
const $ = s => document.querySelector(s);
const app = $('#app');
const LS = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const rnd = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const today = () => new Date().toISOString().slice(0, 10);
const esc = s => String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ================= 题库索引 ================= */
function comboIndex(word, combo) {
  if (combo.includes('_')) {
    const m = word.match(new RegExp(combo.replace(/_/g, '.')));
    return m ? m.index : -1;
  }
  return word.indexOf(combo);
}
function hlWord(word, combo) {
  if (!combo) return esc(word);
  const i = comboIndex(word, combo), len = combo.length;
  if (i < 0) return esc(word);
  return esc(word.slice(0, i)) + '<span class="hl">' + esc(word.slice(i, i + len)) + '</span>' + esc(word.slice(i + len));
}

/* 全局词池：用于生成干扰项 */
const WPOOL = [];
function pushW(w) { if (w && w.w && !WPOOL.some(x => x.w === w.w)) WPOOL.push({ w: w.w, ipa: w.ipa, c: w.c }); }
GROUPS.forEach(g => g.phonemes.forEach(p => p.words.forEach(w => pushW(w))));
PH_PAT.forEach(p => p.words.forEach(w => pushW(w)));
CVC_WORDS.forEach(w => pushW(w));
CCVC_WORDS.forEach(w => pushW(w));
TRICKY_WORDS.forEach(w => pushW(w));
SILENT_WORDS.forEach(w => pushW(w));

/* 全局音标池 */
function ipaPool(stage, exclude) {
  const set = [];
  const add = x => { if (x && x !== exclude && !set.includes(x)) set.push(x); };
  if (stage) stage.points.forEach(p => add(p.ipa));
  ALL_PHONEMES.forEach(p => add(p.ipa));
  PH_PAT.forEach(p => add(p.ipa));
  return set;
}

/* ================= 状态 ================= */
const S = {
  view: 'home',
  viewP: null,
  sound: LS.get('pq_sound', true),
  rate: LS.get('pq_rate', .85),
  prog: LS.get('pq_prog', {}),      // { pointId: {best, tries, last} }
  lv: LS.get('pq_lv', {}),          // { stageId|idx: {best, done} }
  wrong: LS.get('pq_wrong', []),    // 错题本
  tab: {},
  openPt: null,
  day: LS.get('pq_day', 1)
};
function saveProg() { LS.set('pq_prog', S.prog); LS.set('pq_lv', S.lv); }

/* ================= 发音 ================= */
let voices = [];
function loadVoices() { try { voices = speechSynthesis.getVoices() || []; } catch (e) { voices = []; } }
if (window.speechSynthesis) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function pickVoice() {
  if (!voices.length) loadVoices();
  return voices.find(v => /en[-_]GB/i.test(v.lang)) || voices.find(v => /^en/i.test(v.lang)) || null;
}
function speak(text, opt) {
  opt = opt || {};
  if (!S.sound || !window.speechSynthesis) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    const v = pickVoice();
    if (v) u.voice = v;
    u.lang = (v && v.lang) || 'en-GB';
    u.rate = opt.rate || S.rate;
    speechSynthesis.speak(u);
  } catch (e) {}
}

/* ================= 嘴型图 ================= */
function mouthSVG(m, cap) {
  if (!m) return '';
  const open = m.open, round = m.round, spread = m.spread;
  const w = 82 - round * 26 + spread * 14;
  const h = 4 + open * 44;
  const ry = Math.max(2.5, h / 2);
  const cy = 110, cx = 100;
  const tx = cx + (m.place === '前' ? -w * .12 : m.place === '后' ? w * .12 : 0);
  const tongue = m.place === '软腭' || m.place === '声门' || m.place === '齿龈后';
  return `<svg viewBox="0 0 200 150" width="150" height="112">
    <ellipse cx="100" cy="72" rx="60" ry="66" fill="#ffe3cd"/>
    <ellipse cx="78" cy="56" rx="3.6" ry="4.6" fill="#3a3a4a"/>
    <ellipse cx="122" cy="56" rx="3.6" ry="4.6" fill="#3a3a4a"/>
    <path d="M100 60 q7 14 -3 17" stroke="#e6a487" stroke-width="3" fill="none" stroke-linecap="round"/>
    <ellipse cx="${cx}" cy="${cy}" rx="${w / 2 + 3}" ry="${ry + 3}" fill="#e8a08f"/>
    <ellipse cx="${cx}" cy="${cy}" rx="${w / 2}" ry="${ry}" fill="#7d2c39"/>
    <ellipse cx="${cx}" cy="${cy + ry * .22}" rx="${Math.max(1, w / 2 - 3)}" ry="${Math.max(1, ry * .62)}" fill="#4a1622"/>
    <rect x="${cx - w / 2 + 4}" y="${cy - ry + 1}" width="${Math.max(1, w - 8)}" height="3.4" rx="1.6" fill="#fff"/>
    ${tongue ? '' : `<ellipse cx="${tx}" cy="${cy + ry * .45}" rx="${w * .26}" ry="${ry * .3}" fill="#e0736f"/>`}
    <text x="100" y="140" text-anchor="middle" font-size="11" fill="#5b6488">${esc(cap || '')}</text>
  </svg>`;
}
function gauge(label, v) {
  return `<div class="gauge"><span style="width:52px">${label}</span><span class="g"><i style="width:${Math.round(v * 100)}%"></i></span><span style="width:32px">${Math.round(v * 100)}%</span></div>`;
}
function mouthOf(p) {
  const m = BY_IPA[p.ipa];
  return m ? m.mouth : null;
}

/* ================= 提示 / 特效 ================= */
function toast(msg, ms) {
  const d = document.createElement('div');
  d.className = 'toast'; d.textContent = msg;
  $('#fx-root').appendChild(d);
  setTimeout(() => d.remove(), ms || 1600);
}
function confetti() {
  const colors = ['#5b5bd6', '#ec4899', '#f59e0b', '#12b981', '#22d3ee'];
  for (let i = 0; i < 60; i++) {
    const c = document.createElement('i');
    c.className = 'cf';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.top = '-20px';
    c.style.background = colors[i % colors.length];
    c.style.animationDelay = (Math.random() * .5) + 's';
    c.style.transform = `rotate(${Math.random() * 180}deg)`;
    $('#fx-root').appendChild(c);
    setTimeout(() => c.remove(), 2200);
  }
}
function modal(title, sub, html) {
  $('#modal-root').innerHTML = `
    <div class="mask" data-act="closeModal">
      <div class="modal">
        <button class="modal-close" data-act="closeModal">✕</button>
        <h3>${title}</h3>
        <div class="sub">${sub}</div>
        ${html}
      </div>
    </div>`;
}

/* ================= 全局动作 ================= */
const ACT = {};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  if (el.classList.contains('mask') && e.target !== el) return;
  const fn = ACT[el.dataset.act];
  if (fn) fn(el.dataset, el, e);
});

ACT.home = () => { stopTimer(); go('home'); };
ACT.back = () => { stopTimer(); go(S.view === 'drill' && D ? 'stage' : 'home', D ? D.st.id : null); };
ACT.speak = d => speak(d.text || d.w, d.slow ? { rate: .6 } : null);
ACT.closeModal = () => { $('#modal-root').innerHTML = ''; };
ACT.sound = () => {
  S.sound = !S.sound; LS.set('pq_sound', S.sound);
  $('#btn-sound').textContent = S.sound ? '🔊' : '🔇';
  $('#btn-sound').classList.toggle('off', !S.sound);
};
ACT.stage = d => go('stage', d.id);
ACT.tab = d => { S.tab[d.id] = d.t; render(); };
ACT.pt = d => { S.openPt = (S.openPt === d.k) ? null : d.k; render(); };
ACT.goday = d => { S.day = +d.d; LS.set('pq_day', S.day); render(); };
ACT.startDay = d => {
  const day = +d.d;
  S.day = day; LS.set('pq_day', day);
  const stages = DAYS.find(x => x.d === day).stages.map(id => STAGES.find(s => s.id === id));
  const next = stages.find(s => stageStat(s).pct < 100) || stages[0];
  go('stage', next.id);
};

/* ================= 路由 ================= */
function go(v, p) { S.view = v; S.viewP = p; render(); window.scrollTo(0, 0); }
function render() {
  const v = VIEWS[S.view] || VIEWS.home;
  app.innerHTML = '<div class="view">' + v(S.viewP) + '</div>';
  $('#btn-sound').textContent = S.sound ? '🔊' : '🔇';
  $('#btn-sound').classList.toggle('off', !S.sound);

  wb.textContent = S.wrong.length > 99 ? '99+' : S.wrong.length;
  wb.style.display = S.wrong.length ? '' : 'none';
}

/* ================= 进度计算 ================= */
const KIND_GRP = {
  letter: '字母音', ph: '音素与拼写', blend: '拼读练习',
  syltype: '六大音节类型', sylrule: '七条划分规则', stress: '敲重音',
  suffix: '词尾与后缀', spell: '拼写通则', silent: '静默字母', tricky: '不规则词'
};
function ptGrp(p) { return p.grp || KIND_GRP[p.kind] || '练习'; }
function ptName(p) {
  if (p.kind === 'letter') return p.l.toUpperCase() + ' / ' + p.ipa;
  if (p.kind === 'blend') return p.w;
  if (p.kind === 'syltype') return p.name;
  if (p.kind === 'sylrule') return '规则 ' + p.n + '·' + p.name;
  if (p.kind === 'stress') return p.w;
  if (p.kind === 'suffix') return p.w;
  if (p.kind === 'spell') return p.n + '·' + p.name;
  if (p.kind === 'silent') return p.w;
  if (p.kind === 'tricky') return p.w;
  return p.label || p.ipa;
}
function mastered(p) { const r = S.prog[p.id]; return !!r && r.best >= .8; }
function seen(p) { return !!S.prog[p.id]; }

/* 关卡切分：按 grp 分段 → 每段内按题数上限切 → 末尾过小的并入上一关 → 追加混合复习关 */
function chunkRun(items, maxQ) {
  const out = []; let cur = [], q = 0;
  items.forEach(p => {
    const n = p.n || 1;
    if (cur.length && q + n > maxQ) { out.push(cur); cur = []; q = 0; }
    cur.push(p); q += n;
  });
  if (cur.length) out.push(cur);
  if (out.length > 1) {
    const last = out[out.length - 1];
    const lq = last.reduce((a, b) => a + (b.n || 1), 0);
    if (lq < 4) { out[out.length - 2] = out[out.length - 2].concat(last); out.pop(); }
  }
  return out;
}
function stageLevels(st) {
  if (st._lv) return st._lv;
  const runs = [];
  st.points.forEach(p => {
    const g = ptGrp(p);
    if (!runs.length || runs[runs.length - 1].g !== g) runs.push({ g, items: [] });
    runs[runs.length - 1].items.push(p);
  });
  const lv = [];
  runs.forEach(run => chunkRun(run.items, st.maxQ || 14).forEach(part => lv.push({ grp: run.g, items: part })));
  lv.forEach((l, i) => {
    l.i = i; l.id = st.id + '|' + i;
    l.n = l.items.reduce((a, b) => a + (b.n || 1), 0);
    l.name = l.grp;
  });
  if (st.mix) {
    lv.push({ i: lv.length, id: st.id + '|' + lv.length, grp: '混合复习', mix: st.mix, items: [], n: st.mix, name: '🎲 混合复习（交错练习）' });
  }
  // 同名关卡加序号
  const cnt = {};
  lv.forEach(l => {
    if (l.mix) return;
    cnt[l.grp] = (cnt[l.grp] || 0) + 1;
    const total = lv.filter(x => x.grp === l.grp && !x.mix).length;
    l.name = total > 1 ? l.grp + ' · ' + cnt[l.grp] + '/' + total : l.grp;
  });
  st._lv = lv;
  return lv;
}
function stageStat(st) {
  const tot = st.points.length;
  let done = 0;
  st.points.forEach(p => { if (mastered(p)) done++; });
  const lv = stageLevels(st);
  const lvDone = lv.filter(l => S.lv[l.id] && S.lv[l.id].done).length;
  return { tot, done, lvTot: lv.length, lvDone, pct: tot ? Math.round(done / tot * 100) : 0, q: lv.reduce((a, b) => a + b.n, 0) };
}
function dayStat(day) {
  const stages = DAYS.find(d => d.d === day).stages.map(id => STAGES.find(s => s.id === id));
  const tot = stages.reduce((a, s) => a + s.points.length, 0);
  const done = stages.reduce((a, s) => a + stageStat(s).done, 0);
  return { tot, done, pct: tot ? Math.round(done / tot * 100) : 0, stages };
}
function totalStat() {
  const tot = STAGES.reduce((a, s) => a + s.points.length, 0);
  const done = STAGES.reduce((a, s) => a + stageStat(s).done, 0);
  return { tot, done, pct: tot ? Math.round(done / tot * 100) : 0 };
}
/* 待复习：练过但没掌握的 + 完全没练的优先排在后面 */
function reviewQueue(n) {
  const weak = [], fresh = [];
  STAGES.forEach(st => st.points.forEach(p => {
    if (mastered(p)) return;
    if (seen(p)) weak.push({ p, st }); else fresh.push({ p, st });
  }));
  weak.sort((a, b) => (S.prog[a.p.id].best) - (S.prog[b.p.id].best));
  return { weak, fresh: fresh.slice(0, Math.max(0, (n || 12) - weak.length)) };
}

/* =========================================================================
   题目生成器：每个知识点按 n 逐题穷举
   ========================================================================= */
function pickN(arr, n, filter) {
  const a = shuffle(arr.filter(filter || (() => true)));
  return a.slice(0, n);
}
function uniqIpaOpts(correct, pool, n) {
  const opts = [{ t: correct, ok: true }];
  const used = {}; used[correct] = 1;
  shuffle(pool).forEach(x => { if (opts.length < n && !used[x]) { used[x] = 1; opts.push({ t: x, ok: false }); } });
  return shuffle(opts);
}
function uniqWordOpts(correct, pool, n) {
  const opts = [{ w: correct.w, ipa: correct.ipa, ok: true }];
  const used = {}; used[correct.w] = 1;
  shuffle(pool).forEach(x => { if (opts.length < n && !used[x.w]) { used[x.w] = 1; opts.push({ w: x.w, ipa: x.ipa, ok: false }); } });
  return shuffle(opts);
}

const QGEN = {};

/* ---------- 字母音 ---------- */
QGEN.letter = (p, st, i) => {
  if (i === 0) {
    const batch = LETTER_SOUNDS.filter(x => x.batch === p.batch && x.l !== p.l);
    const fill = shuffle(LETTER_SOUNDS.filter(x => x.l !== p.l && !batch.includes(x)));
    const others = shuffle(batch).concat(fill).slice(0, 3);
    const opts = shuffle([
      { main: (p.l[0].toUpperCase() + p.l.slice(1)) + (p.l.length > 1 ? '' : p.l), sub: p.ipa, ok: true },
      ...others.map(x => ({ main: (x.l[0].toUpperCase() + x.l.slice(1)) + (x.l.length > 1 ? '' : x.l), sub: x.ipa, ok: false }))
    ]);
    return {
      pid: p.id, type: '听音选字母',
      head: `<div class="hl-word">${esc(p.kw)}</div>
             <div class="sub">这个词的<b>第一个音</b>是哪个字母？</div>
             <button class="listen-btn" data-act="speak" data-text="${esc(p.kw)}">🔊 再听一次</button>`,
      opts, autoplay: true, speakText: p.kw,
      why: `${p.kw} 的第一个音是 ${p.ipa}，对应字母 <b>${p.l.toUpperCase()}</b>。记住：问的是"音"，不是字母名字。`
    };
  }
  const pool = ipaPool(null, p.ipa);
  const opts = uniqIpaOpts(p.ipa, pool, 4);
  return {
    pid: p.id, type: '字母 → 音',
    head: `<div class="big" style="font-size:44px;font-weight:800">${esc(p.l.toUpperCase())} ${esc(p.l)}</div>
           <div class="sub">这个字母发什么音？（关键词：${esc(p.kw)}）</div>`,
    opts: opts.map(o => ({ main: o.t, cls: 'ipa', ok: o.ok })),
    speakText: p.kw,
    why: `<b>${p.l.toUpperCase()}</b> 发 ${p.ipa}，关键词 ${p.kw} ${p.kwIpa}。动作记忆：${p.act}`
  };
};

/* ---------- 音素 / 拼写模式 ---------- */
QGEN.ph = (p, st, i) => {
  const key = i % 2;
  if (key === 0) {
    const ws = p.words.filter(w => !p.sym || w.ipa.includes(p.sym));
    const w = rnd(ws.length ? ws : p.words);
    const opts = uniqIpaOpts(p.ipa, ipaPool(st, p.ipa), 4);
    return {
      pid: p.id, type: '组合 → 音',
      head: `<div class="hl-word">${hlWord(w.w, w.c)}</div>
             <div class="sub">红色的 <b>${esc(w.c || '')}</b> 在这里发什么音？</div>
             ${w.note ? `<div class="sub" style="color:var(--warn)">${esc(w.note)}</div>` : ''}`,
      opts: opts.map(o => ({ main: o.t, cls: 'ipa', ok: o.ok })),
      speakText: w.w,
      why: `<b>${esc(w.w)}</b> ${esc(w.ipa)}：${esc(w.c || '')} 读 ${p.ipa}。${p.vs ? esc(p.vs) : ''}`
    };
  }
  const ws = p.words.filter(w => !p.sym || w.ipa.includes(p.sym));
  const w = rnd(ws.length ? ws : p.words);
  const bad = WPOOL.filter(x => x.w !== w.w && (!p.sym || !x.ipa.includes(p.sym)));
  const opts = uniqWordOpts(w, bad, 4);
  return {
    pid: p.id, type: '音 → 单词',
    head: `<div class="big ipa">${esc(p.ipa)}</div><div class="sub">哪个词里含这个音？</div>`,
    opts: opts.map(o => ({ main: o.w, sub: o.ipa, ok: o.ok })),
    speakText: w.w,
    why: `<b>${esc(w.w)}</b> ${esc(w.ipa)} 含 ${p.ipa}。${p.label || ''}：${esc(p.say || '')}`
  };
};

/* ---------- 拼读（CVC / CCVC） ---------- */
QGEN.blend = (p, st) => {
  const pool = st.points.filter(x => x.kind === 'blend' && x.w !== p.w);
  const others = pickN(pool.length >= 3 ? pool : WPOOL.filter(x => x.w !== p.w), 3);
  const opts = shuffle([{ w: p.w, ipa: p.ipa, ok: true }, ...others.map(x => ({ w: x.w, ipa: x.ipa, ok: false }))]);
  return {
    pid: p.id, type: '合音拼词',
    head: `<div class="sub">把这些音连起来读，是哪个词？</div>
           <div class="snds">${p.sounds.map(s => `<span class="snd ipa">${esc(s)}</span>`).join('<span class="plus">+</span>')}</div>
           <button class="listen-btn" data-act="speak" data-text="${esc(p.w)}">🔊 听答案</button>`,
    opts: opts.map(o => ({ main: o.w, sub: o.ipa, ok: o.ok })),
    autoplay: true, speakText: p.w,
    why: `${p.sounds.join(' + ')} → <b>${esc(p.w)}</b> ${esc(p.ipa)}${p.note ? '（' + esc(p.note) + '）' : ''}<br>拼写块：${p.blocks.join(' · ')}`
  };
};

/* ---------- 音节类型 ---------- */
QGEN.syltype = (p, st, i) => {
  const cand = SYL_TYPE_WORDS.filter(x => x.types.includes(p.key));
  const t = cand[(i || 0) % cand.length];
  const idxs = t.types.map((x, k) => x === p.key ? k : -1).filter(k => k >= 0);
  const i2 = idxs[(i || 0) % idxs.length];
  const bad = shuffle(SYLLABLE_TYPES.filter(x => x.key !== p.key)).slice(0, 3);
  const opts = shuffle([{ k: p.key, ok: true }, ...bad.map(x => ({ k: x.key, ok: false }))]);
  return {
    pid: p.id, type: '音节类型',
    head: `<div class="hl-word">${esc(t.w)}</div>
           <div class="sub ipa">${esc(t.ipa)}</div>
           <div class="sub">慢速拆分：<b>${t.syl.map((s, k) => (k === i2 ? '<u>' + esc(s) + '</u>' : esc(s))).join(' · ')}</b></div>
           <div class="sub">${t.syl.length > 1 ? `第 <b>${i2 + 1}</b> 个音节 ` : ''}<b>「${esc(t.syl[i2])}」</b> 属于哪种类型？</div>`,
    opts: opts.map(o => {
      const T = SYLLABLE_TYPES.find(x => x.key === o.k);
      return { main: T.name.split(' ')[0], sub: T.name.split(' ').slice(1).join(' '), ok: o.ok };
    }),
    speakText: t.w,
    why: `${esc(t.w)} 全部音节：${t.syl.map((s, k) => esc(s) + '(' + (SYLLABLE_TYPES.find(x => x.key === t.types[k]).name.split(' ')[0]) + ')').join(' · ')}<br><b>${p.name}</b>：${SYL_TYPE_HINT[p.key] || p.say}`
  };
};

/* ---------- 音节划分规则 ---------- */
QGEN.sylrule = (p, st) => {
  const cand = STRESS_WORDS.filter(x => x.rule === p.n);
  const t = cand.length ? rnd(cand) : rnd(STRESS_WORDS);
  const bad = shuffle(SYLLABLE_RULES.filter(x => x.n !== p.n)).slice(0, 3);
  const opts = shuffle([{ n: p.n, ok: true }, ...bad.map(x => ({ n: x.n, ok: false }))]);
  return {
    pid: p.id, type: '音节划分',
    head: `<div class="hl-word">${esc(t.w)}</div>
           <div class="sub ipa">${esc(t.ipa)}</div>
           <div class="sub">音节：<b>${t.syl.join(' · ')}</b></div>
           <div class="sub">这个词按哪条规则切分？</div>`,
    opts: opts.map(o => {
      const R = SYLLABLE_RULES.find(x => x.n === o.n);
      return { main: R.name, sub: R.ex.split(',')[0], ok: o.ok };
    }),
    speakText: t.w,
    why: `规则 ${p.n}「${p.name}」：${p.ex}<br>${esc(t.w)} → ${t.syl.join(' · ')}`
  };
};

/* ---------- 重音 ---------- */
QGEN.stress = (p, st) => {
  const opts = p.syl.map((s, i) => ({ main: s, sub: '第 ' + (i + 1) + ' 音节', ok: i === p.stress }));
  return {

    opts, speakText: p.w,
    why: `<b>${esc(p.w)}</b> ${esc(p.ipa)}：重音在第 <b>${p.stress + 1}</b> 个音节「${esc(p.syl[p.stress])}」。<br>其余音节一律弱读成 /ə/，这是英式节奏的灵魂。`
  };

/* ---------- 词尾与后缀 ---------- */
QGEN.suffix = (p, st) => ({
  pid: p.id, type: '词尾发音',
  head: `<div class="hl-word">${esc(p.w)}</div>
         <div class="sub ipa">${esc(p.ipa)}</div>

/* ---------- 拼写通则 ---------- */
QGEN.spell = (p, st, i) => {
  if (p.n % 2 === 0) {
    const bad = shuffle(SPELLING_RULES.filter(x => x.n !== p.n)).slice(0, 3);
    const opts = shuffle([{ n: p.n, ok: true }, ...bad.map(x => ({ n: x.n, ok: false }))]);
    return {
      pid: p.id, type: '拼写通则',
      head: `<div class="rulebox">${esc(p.rule)}</div><div class="sub">这是哪条规则？</div>`,
      opts: opts.map(o => ({ main: SPELLING_RULES.find(x => x.n === o.n).name, ok: o.ok })),
      why: `<b>规则 ${p.n}·${p.name}</b><br>${esc(p.ex)}`
    };
  }
  const bad = shuffle(SPELLING_RULES.filter(x => x.n !== p.n)).slice(0, 3);
  const opts = shuffle([{ n: p.n, ok: true }, ...bad.map(x => ({ n: x.n, ok: false }))]);
  return {
    pid: p.id, type: '拼写通则',
    head: `<div class="hl-word" style="font-size:26px">${esc(p.name)}</div><div class="sub">这条规则说的是什么？</div>`,
    opts: opts.map(o => ({ main: SPELLING_RULES.find(x => x.n === o.n).rule.slice(0, 34) + '…', ok: o.ok })),
    why: `<b>规则 ${p.n}·${p.name}</b>：${esc(p.rule)}<br>${esc(p.ex)}`
  };
};

/* ---------- 静默字母 ---------- */
QGEN.silent = (p, st) => {
  const pool = [...new Set(p.w.split('').filter(c => c !== p.s))];
  const filler = shuffle(['b', 'c', 'd', 'g', 'h', 'k', 'l', 'm', 'p', 'r', 't', 'w'].filter(c => c !== p.s && !pool.includes(c)));
  const ps = shuffle(pool);
  const others = ps.slice(0, 3).concat(filler.slice(0, Math.max(0, 3 - ps.length)));
  const opts = shuffle([{ t: p.s, ok: true }, ...others.map(t => ({ t, ok: false }))]);
  return {
    pid: p.id, type: '静默字母',
    head: `<div class="hl-word">${esc(p.w)}</div>
           <div class="sub ipa">${esc(p.ipa)}</div>
           <div class="sub">哪个字母<b>不发音</b>？</div>
           <button class="listen-btn" data-act="speak" data-text="${esc(p.w)}">🔊 听</button>`,
    opts: opts.map(o => ({ main: o.t, ok: o.ok })),
    speakText: p.w,
    why: `<b>${esc(p.w)}</b> ${esc(p.ipa)}：字母 <b>${esc(p.s)}</b> 不发音。${esc(p.note)}`
  };
};

/* ---------- 高频不规则词 ---------- */
QGEN.tricky = (p, st) => {
  const gs = p.gs || [p.g];
  const same = shuffle(TRICKY_WORDS.filter(x => (x.gs || [x.g]).some(k => gs.includes(k)) && x.ipa !== p.ipa));
  const rest = shuffle(TRICKY_WORDS.filter(x => x.ipa !== p.ipa));
  const pool = same.concat(rest).map(x => x.ipa);
  const opts = uniqIpaOpts(p.ipa, pool, 4);
  return {
    pid: p.id, type: '不规则词',
    head: `<div class="hl-word">${esc(p.w)}</div>
           <div class="sub">规则只覆盖约 <b>85%</b> 的词，这个必须整体记忆</div>
           <button class="listen-btn" data-act="speak" data-text="${esc(p.w)}">🔊 听单词</button>`,
    opts: opts.map(o => ({ main: o.t, cls: 'ipa', ok: o.ok })),
    autoplay: true, speakText: p.w,
    why: `<b>${esc(p.w)}</b> ${esc(p.ipa)}：${esc(p.why)}<br>💡 ${esc(p.tip)}`
  };
};

/* ---------- 最小对立对（听力反向验证） ---------- */
function genPair() {
  const pair = rnd(MIN_PAIRS);
  const flip = Math.random() < .5;
  const target = flip ? pair.b : pair.a;
  const other = flip ? pair.a : pair.b;
  const opts = shuffle([{ ...target, ok: true }, { ...other, ok: false }]);
  return {
    pid: 'PAIR:' + pair.a.w + '-' + pair.b.w, type: '听音辨词',
    head: `<div style="font-size:15px;font-weight:700">你听到的是哪个词？</div>
           <div class="sub">对立音：${esc(pair.focus)}</div>
           <button class="listen-btn" data-act="speak" data-text="${esc(target.w)}">🔊 再听一次</button>`,
    opts: opts.map(o => ({ main: o.w, sub: o.ipa, ok: o.ok })),
    autoplay: true, speakText: target.w,
    why: `答案是 <b>${esc(target.w)}</b> ${esc(target.ipa)}；另一个是 ${esc(other.w)} ${esc(other.ipa)}。区分点：${esc(pair.focus)}`
  };
}
const PAIR_STAGES = ['s2', 's3', 's6', 's7', 's10'];

/* 生成某关的全部题目（穷举 + 保序） */
function buildQuestions(st, lv) {
  const qs = [];
  if (lv.mix) {
    for (let i = 0; i < lv.mix; i++) {
      const p = rnd(st.points);
      const g = QGEN[p.kind];
      if (!g) continue;
      if (PAIR_STAGES.includes(st.id) && i % 4 === 3) { qs.push(genPair()); continue; }
      const q = g(p, st, Math.floor(Math.random() * (p.n || 1)));
      if (q) qs.push(q);
    }
    return qs;
  }
  lv.items.forEach(p => {
    const g = QGEN[p.kind];
    if (!g) return;
    for (let i = 0; i < (p.n || 1); i++) {
      const q = g(p, st, i);
      if (q) qs.push(q);
    }
  });
  return qs;
}

/* =========================================================================
   练习运行器
   ========================================================================= */
const VIEWS = {};
let D = null;

function startDrill(stageId, lvIdx) {
  const st = STAGES.find(x => x.id === stageId);
  const lv = stageLevels(st)[lvIdx];
  const qs = buildQuestions(st, lv);
  if (!qs.length) { toast('这一关暂时没有题目'); return; }
  stopTimer();
  D = { st, lv, qs, i: 0, ok: 0, wrongs: [], per: {}, locked: false, from: S.view };
  go('drill');
  nextQ();
}
function nextQ() {
  if (!D) return;
  if (D.i >= D.qs.length) return finishDrill();
  D.locked = false;
  drawGame();
  const q = D.qs[D.i];
  if (q.autoplay) setTimeout(() => speak(q.speakText), 380);
}
function drawGame() {
  app.innerHTML = '<div class="view">' + VIEWS.drill() + '</div>';
}
function stopTimer() { if (D && D.t1) { clearTimeout(D.t1); D.t1 = null; } }

VIEWS.drill = () => {
  const q = D.qs[D.i];
  const pct = Math.round(D.i / D.qs.length * 100);
  const one = q.opts.length >= 4 ? '' : 'one';
  return `
  <div class="game-head">
    <button class="back" data-act="drillQuit">✕</button>
    <div class="grow">
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div style="font-size:11px;color:var(--ink2);margin-top:5px">${esc(D.st.name)} · ${esc(D.lv.name)}</div>
    </div>
    <div class="hud">
      <span><b>${D.i + 1}</b>/${D.qs.length}</span>
      <span>✅ <b>${D.ok}</b></span>
    </div>
  </div>
  <div class="qbar">
    <span class="qtype">${esc(q.type)}</span>
    <span style="font-size:11px;color:var(--ink2)">不计时 · 想清楚再选</span>
  </div>
  <div class="card">
    <div class="prompt">${q.head}</div>
    <div class="opts ${one}">
      ${q.opts.map((o, i) => `<button class="opt" data-act="opt" data-i="${i}"><span class="${o.cls || ''}">${o.main}</span><small class="ipa">${o.sub || ''}</small></button>`).join('')}
    </div>
    <div id="fb"></div>
  </div>
  <p class="tip" style="margin-top:12px;font-size:12px">答错不要紧 —— 一定要读完「为什么」，这一步才是真正长记忆的地方。</p>`;
};

ACT.opt = d => {
  if (!D || D.locked) return;
  const i = +d.i;
  const q = D.qs[D.i];
  judge(i === q.opts.findIndex(o => o.ok), i);
};
ACT.drillQuit = () => { stopTimer(); const id = D && D.st.id; D = null; go(id === 'sprint' ? 'home' : 'stage', id === 'sprint' ? null : id); };

function judge(ok, myIdx) {
  if (!D || D.locked) return;
  D.locked = true; stopTimer();
  const q = D.qs[D.i];
  const ri = q.opts.findIndex(o => o.ok);
  const btns = [...document.querySelectorAll('.opt')];
  if (ok) {
    D.ok++;
    if (btns[ri]) btns[ri].classList.add('ok');
    speak(q.speakText || (q.opts[ri] && q.opts[ri].main));
  } else {
    if (btns[ri]) btns[ri].classList.add('ok');
    if (myIdx != null && btns[myIdx]) btns[myIdx].classList.add('bad');
    D.wrongs.push({ w: q.speakText || (q.opts[ri] && q.opts[ri].main), ipa: q.opts[ri] && q.opts[ri].sub, why: q.why, type: q.type, pid: q.pid, st: D.st.id });
  }
  const per = D.per[q.pid] || (D.per[q.pid] = { n: 0, ok: 0 });
  per.n++; if (ok) per.ok++;
  const fb = $('#fb');
  if (fb && (!ok || q.why)) {
    fb.innerHTML = `<div class="tip ${ok ? 'ok' : ''}">${ok ? '✅ 答对了' : '❌ 正确答案'} —— ${q.why || ''}</div>`;
  }
  D.t1 = setTimeout(() => { D.i++; nextQ(); }, ok ? 1000 : (q.why && q.why.length > 60 ? 3200 : 2300));
}

function finishDrill() {
  stopTimer();
  const total = D.qs.length || 1;
  const acc = Math.round(D.ok / total * 100);
  const key = D.lv.id;
  const prev = S.lv[key] || { best: 0, done: false };
  S.lv[key] = { best: Math.max(prev.best, acc), done: true, tries: (prev.tries || 0) + 1 };
  // 知识点掌握度
  Object.keys(D.per).forEach(pid => {
    if (pid.indexOf('PAIR:') === 0) return;
    const r = D.per[pid], o = S.prog[pid] || { best: 0, tries: 0 };
    const cur = r.n ? r.ok / r.n : 0;
    S.prog[pid] = { best: Math.max(o.best || 0, cur), tries: (o.tries || 0) + 1, last: today() };
  });
  D.wrongs.forEach(w => {
    if (w.w && !S.wrong.some(x => x.w === w.w && x.type === w.type)) S.wrong.unshift({ w: w.w, ipa: w.ipa, why: w.why, type: w.type, st: w.st, ts: Date.now() });
  });
  S.wrong = S.wrong.slice(0, 60);
  saveProg(); LS.set('pq_wrong', S.wrong);
  D.result = { acc, total };
  if (acc >= 80) confetti();
  go('drillEnd');
}

VIEWS.drillEnd = () => {
  const r = D.result, st = D.st;
  const isSprint = st.id === 'sprint';

    .map(k => st.points.find(p => p.id === k)).filter(Boolean);

  <div class="card result">

    <div class="score">${r.acc}%</div>
    <div class="meta">${esc(D.lv.name)} · ${r.total} 题 · 答对 ${D.ok} 题</div>

    ${D.wrongs.length ? `

  </div>`;
};

ACT.nextLv = () => { const id = D.st.id, i = D.lv.i + 1; D = null; startDrill(id, i); };
ACT.retryLv = () => { const id = D.st.id, i = D.lv.i; D = null; startDrill(id, i); };

function ring(pct, size) {
  size = size || 54;
  const r = size / 2 - 5, c = 2 * Math.PI * r;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="#e8ebf8" stroke-width="6"/>
    <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="url(#g1)" stroke-width="6"
      stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - pct / 100)}"
      transform="rotate(-90 ${size / 2} ${size / 2})"/>
    <defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5b5bd6"/><stop offset="100%" stop-color="#ec4899"/></linearGradient></defs>
    <text x="50%" y="50%" text-anchor="middle" dy="4" font-size="${size / 3.6}" font-weight="800" fill="#1e2340">${pct}%</text>
  </svg>`;
}

ACT.method = () => {
  modal('为什么这样安排？', '三套经典体系 + 三条记忆规律', `
    <div class="mdoc">
      <h4>① 教学顺序：Jolly Phonics（英国 Sue Lloyd / Sara Wernham）</h4>
      <p>42 个音素分 7 组，第一组只有 <b>s a t i p n</b> —— 六个音就能拼出 sat / pin / tip / nap 等真词，
      让孩子第一天就体验到"我能读"。顺序刻意不是 A→Z；b 和 d 被分在不同批次，避免形音双重混淆。</p>

      <h4>② 阶段划分：Letters and Sounds（英国 DfE，2007）</h4>
      <p>Phase 2 单字母 → Phase 3 二合字母 → Phase 4 相邻辅音（不教新音，专练合音）
      → Phase 5 复杂代码（一音多拼）→ Phase 6 词缀与拼写。
      同时强调 <b>Tricky Words</b>（不规则词）必须单独整体记忆 —— 规则只能覆盖约 85% 的词。</p>

      <h4>③ 长词解码：Orton-Gillingham 六大音节类型</h4>
      <p>closed → open → VCe → vowel team → r-controlled → consonant-le。
      这六种类型决定了元音"读长还是读短"，是长词解码的总开关。</p>

      <h4>④ 记忆规律：检索 &gt; 重复阅读</h4>
      <p>Roediger &amp; Karpicke（2006）：同样时间下，做测验比重复阅读一周后多记住约 50%。
      所以本页以<b>做题</b>为主，不做"看着读"。答错后必须给出"为什么"——
      检索失败而没有反馈，是不会强化记忆的。</p>

      <h4>⑤ 间隔 + 交错</h4>
      <p>Cepeda 等（2006）：分散练习比集中练习留存高 10–30%；Rohrer（2020）的课堂实验显示，

      <h4>⑥ 多感官编码</h4>

    </div>`);
};

ACT.sprint = () => {
  const qs = [];
  for (let i = 0; i < 20; i++) {
    const st = rnd(STAGES);
    const p = rnd(st.points);
    const g = QGEN[p.kind];
    if (!g) continue;
    const q = g(p, st, Math.floor(Math.random() * (p.n || 1)));
    if (q) qs.push(q);
    if (i % 5 === 4) qs.push(genPair());
  }
  stopTimer();
  D = { st: { id: 'sprint', name: '综合冲刺' }, lv: { id: 'sprint', name: '跨阶段交错', i: -1 }, qs, i: 0, ok: 0, wrongs: [], per: {}, locked: false };
  go('drill'); nextQ();
};

  <div class="tip" style="margin-top:12px"><b>为什么这样安排：</b>${esc(st.why)}</div>

  <div class="btn-row">
    <button class="btn ghost" data-act="tab" data-id="${st.id}" data-t="learn">📖 先系统学一遍</button>
    <button class="btn primary" data-act="tab" data-id="${st.id}" data-t="drill">✏️ 直接去练习</button>
  </div>`;
}

/* ---------- 学一学：本阶段全部内容 ---------- */
function groupBy(st, fn) {
  const m = [];
  st.points.forEach(p => {
    const k = fn(p);
    if (!m.length || m[m.length - 1].k !== k) m.push({ k, items: [] });
    m[m.length - 1].items.push(p);
  });
  return m;
}

function learnHTML(st) {
  const groups = groupBy(st, ptGrp);
  return `
  <div class="tip ok" style="margin-top:0">
    <b>这一阶段要学的全部内容都在下面（${st.points.length} 个知识点）。</b>
    点任意一张卡片可以展开细节、听发音、看例词。建议先整体过一遍，再去「练一练」。
  </div>
  ${groups.map(g => `
    <div class="sec-title"><h3>${esc(g.k)}</h3><span>${g.items.length} 项</span></div>
    ${renderGroup(g, st)}
  `).join('')}`;
}

function renderGroup(g, st) {
  const k = g.items[0].kind;
  if (k === 'letter') return `<div class="pgrid">${g.items.map(p => `
    <button class="pc ${S.openPt === p.id ? 'on' : ''}" data-act="pt" data-k="${esc(p.id)}">
      <div class="s">${esc(p.l.toUpperCase())}<span class="ipa" style="font-size:14px"> ${esc(p.ipa)}</span></div>
      <div class="l">${esc(p.kw)}</div></button>`).join('')}</div>
    ${g.items.filter(p => S.openPt === p.id).map(p => letterCard(p)).join('')}`;

  if (k === 'ph') return g.items.map(p => phCard(p)).join('');

  if (k === 'blend') return `<div class="wlist" style="justify-content:flex-start">
    ${g.items.map(p => `<button class="wchip" data-act="speak" data-text="${esc(p.w)}">
      <span>${esc(p.w)}</span><small class="ipa">${esc(p.ipa)}</small>
      <span class="cmb">${p.sounds.join(' ')}</span></button>`).join('')}
    </div>
    <p class="tip" style="font-size:12px">拼读顺序：${g.items.slice(0, 4).map(p => esc(p.sounds.join('+')) + ' → ' + esc(p.w)).join('；')} …… 每个词都按"先点着读、再连起来"练。</p>`;

  if (k === 'syltype') return `<div class="rtable">
    ${g.items.map(p => `<div class="rrow">
      <div class="rname"><b>${esc(p.name)}</b><small>${esc(p.pat)}</small></div>
      <div class="rbody">${esc(p.say)}<br><small>元音读${esc(p.vowel)} · 占比 ${esc(p.ratio)} · 例：${esc(p.ex)}</small></div>
    </div>`).join('')}</div>`;

  if (k === 'sylrule') return `<div class="rtable">
    ${g.items.map(p => `<div class="rrow">
      <div class="rname"><b>规则 ${p.n}</b><small>${esc(p.name)}</small></div>
      <div class="rbody">${esc(p.ex)}</div>
    </div>`).join('')}</div>`;

  if (k === 'stress') return `<div class="wlist" style="justify-content:flex-start">
    ${g.items.map(p => `<button class="wchip" data-act="speak" data-text="${esc(p.w)}">
      <span>${p.syl.map((s, i) => (i === p.stress ? '<u>' + esc(s) + '</u>' : esc(s))).join('·')}</span>
      <small class="ipa">${esc(p.ipa)}</small></button>`).join('')}
    </div>
    <p class="tip" style="font-size:12px">下划线的是主重音音节，敲一下拳头；其余音节一律弱读成 /ə/。</p>`;

  if (k === 'suffix') return `<div class="rtable">
    ${g.items.map(p => `<div class="rrow">
      <div class="rname"><b>${esc(p.w)}</b><small class="ipa">${esc(p.ipa)}</small></div>
      <div class="rbody">${esc(p.q)} <b class="ipa">${esc(p.opts[p.ans])}</b><br><small>${esc(p.why)}</small></div>
    </div>`).join('')}</div>`;

  if (k === 'spell') return `<div class="rtable">
    ${g.items.map(p => `<div class="rrow">
      <div class="rname"><b>${p.n}. ${esc(p.name)}</b></div>
      <div class="rbody">${esc(p.rule)}<br><small>${esc(p.ex)}</small></div>
    </div>`).join('')}</div>`;

  if (k === 'silent') return `<div class="wlist" style="justify-content:flex-start">
    ${g.items.map(p => `<button class="wchip" data-act="speak" data-text="${esc(p.w)}">
      <span>${esc(p.w.slice(0, p.si))}<span style="color:var(--bad);text-decoration:line-through">${esc(p.s)}</span>${esc(p.w.slice(p.si + p.s.length))}</span>
      <small class="ipa">${esc(p.ipa)}</small></button>`).join('')}
    </div>
    <p class="tip" style="font-size:12px">${esc(g.items[0].note)}</p>`;

  if (k === 'tricky') {
    const gid = g.items[0].g, G = TRICKY_GROUPS.find(x => x.id === gid);
    return `<div class="tip" style="margin:0 0 10px"><b>${esc(gid)} 组：${esc(G ? G.name : '')}</b> —— ${esc(G ? G.desc : '')}</div>
    <div class="rtable">
      ${g.items.map(p => `<div class="rrow">
        <div class="rname"><button class="lk" data-act="speak" data-text="${esc(p.w)}"><b>${esc(p.w)}</b></button><small class="ipa">${esc(p.ipa)}</small></div>
        <div class="rbody">${esc(p.why)}<br><small>💡 ${esc(p.tip)}</small></div>
      </div>`).join('')}</div>`;
  }
  return '';
}

function letterCard(p) {
  const m = mouthOf(p);
  return `<div class="card kp" style="margin-top:12px">
    <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
      <div style="font-size:34px;font-weight:800">${esc(p.l.toUpperCase())} ${esc(p.l)}</div>
      <b class="ipa" style="font-size:24px">${esc(p.ipa)}</b>
      <button class="mini-btn" data-act="speak" data-text="${esc(p.kw)}">🔊 ${esc(p.kw)}</button>
    </div>
    ${m ? `<div class="mouth-wrap" style="margin-top:10px">
      <div class="mouth-box">${mouthSVG(m, '舌位：' + m.place)}<div class="mouth-cap">${esc(p.ipa)} 嘴型</div></div>
      <div style="max-width:280px;margin:0 auto">
        ${gauge('开合度', m.open)}${gauge('圆唇度', m.round)}${gauge('嘴角展', m.spread)}
      </div></div>` : ''}
    <p class="tip" style="margin-top:12px">🗣 <b>怎么摆</b>：${esc(p.say)}</p>
    <p class="tip">🤸 <b>动作记忆</b>：${esc(p.act)}</p>
    <p class="tip">🔤 <b>关键词</b>：${esc(p.kw)} <span class="ipa">${esc(p.kwIpa)}</span>（第 ${p.batch} 批）</p>
  </div>`;
}

function phCard(p) {
  const open = S.openPt === p.id;
  const m = mouthOf(p);
  return `<div class="kpbox ${open ? 'on' : ''}" style="margin-top:10px">
    <button class="kphead" data-act="pt" data-k="${esc(p.id)}">
      <span class="kp-ipa ipa">${esc(p.ipa)}</span>
      <span class="kp-name">${esc(p.label || p.name || '')}</span>
      <span class="kp-cmb">${(p.combos || []).map(c => '<code>' + esc(c) + '</code>').join(' ')}</span>
      <span class="kp-ar">${open ? '−' : '+'}</span>
    </button>
    ${open ? `<div class="kpbody">
      ${m ? `<div class="mouth-wrap" style="margin:6px 0">
        <div class="mouth-box">${mouthSVG(m, '舌位：' + m.place)}<div class="mouth-cap">${esc(p.ipa)} 嘴型</div></div>
        <div style="max-width:280px;margin:0 auto">
          ${gauge('开合度', m.open)}${gauge('圆唇度', m.round)}${gauge('嘴角展', m.spread)}
        </div></div>` : ''}
      <p class="tip" style="margin-top:10px">🗣 <b>怎么摆</b>：${esc(p.say || '')}</p>
      ${p.vs ? `<p class="tip">⚠️ <b>易混 / 规律</b>：${esc(p.vs)}</p>` : ''}
      <div class="sec-title" style="margin:14px 2px 6px"><h3>例词（点击听发音）</h3><span>${p.words.length} 个</span></div>
      <div class="wlist" style="justify-content:flex-start">
        ${p.words.map(w => `<button class="wchip" data-act="speak" data-text="${esc(w.w)}">
          <span>${hlWord(w.w, w.c)}</span><small class="ipa">${esc(w.ipa)}</small>
          <span class="cmb">${esc(w.c || '')}${w.note ? ' ' + esc(w.note) : ''}</span></button>`).join('')}
      </div>
    </div>` : ''}
  </div>`;
}

/* ---------- 练一练 ---------- */
function drillHTML(st) {
  const lv = stageLevels(st);
  return `
  <div class="tip ok" style="margin-top:0">
    <b>练习按知识点穷举排列</b>：本阶段 ${st.points.length} 个知识点、${lv.reduce((a, l) => a + l.n, 0)} 道题，
    一关一关做完，就能把这一阶段全部覆盖一遍。最后的「混合复习」会把顺序打乱再考一次（交错练习）。
  </div>
  <div class="lvlist">
    ${lv.map(l => {
      const r = S.lv[l.id];
      const pts = l.items.map(p => `<span class="pt ${mastered(p) ? 'ok' : seen(p) ? 'mid' : ''}" title="${esc(ptName(p))}">${esc(ptName(p))}</span>`).join('');
      return `<div class="lvrow ${r && r.done ? 'done' : ''}">
        <div class="lv-main">
          <div class="lv-top">
            <b>${esc(l.name)}</b>
            <span class="lv-n">${l.n} 题</span>
          </div>
          ${l.mix ? '<div class="lv-sub">打乱顺序重考本阶段全部内容 —— 这是检验"真掌握"的地方</div>'
            : `<div class="lv-pts">${pts}</div>`}
          ${r ? `<div class="lv-sub">最好成绩 <b>${r.best}%</b> · 已练 ${r.tries} 次</div>` : ''}
        </div>
        <button class="mini-btn ${r && r.done ? 'ghost' : ''}" data-act="drill" data-id="${st.id}" data-i="${l.i}">
          ${r && r.done ? '再练' : '开始'}
        </button>
      </div>`;
    }).join('')}
  </div>
  <p class="tip" style="font-size:12px">
    小提示：一关最好一次做完（10–15 题，约 5 分钟）。中途退出不会保存进度，但做过的题目会计入掌握度。
  </p>`;
}
ACT.drill = d => startDrill(d.id, +d.i);

/* =========================================================================
   错题本
   ========================================================================= */
VIEWS.review = () => `
  <div class="game-head">
    <button class="back" data-act="home">←</button>
    <div class="grow"><b>📕 错题本</b><div style="font-size:12px;color:var(--ink2)">会保留最近 ${S.wrong.length} 条</div></div>
    ${S.wrong.length ? '<button class="mini-btn ghost" data-act="clearWrong">清空</button>' : ''}
  </div>
  ${S.wrong.length ? S.wrong.map(w => `
    <div class="acc-item" style="margin-bottom:8px">
      <span><b>${esc(w.w)}</b> <span class="ipa" style="color:var(--ink2)">${esc(w.ipa || '')}</span>
        <small style="display:block;color:var(--ink2);margin-top:3px">${w.why || ''}</small></span>
      <button class="mini-btn ghost" data-act="speak" data-text="${esc(w.w)}">🔊</button>
    </div>`).join('')
    : '<div class="empty">🎉 还没有错题</div>'}
  <div class="btn-row"><button class="btn primary" data-act="sprint">🎲 用综合冲刺检验一下</button></div>`;
ACT.review = () => go('review');
ACT.clearWrong = () => { S.wrong = []; LS.set('pq_wrong', []); render(); };

/* =========================================================================
   跟读（输出练习）
   ========================================================================= */
VIEWS.shadow = () => {
  const list = shuffle(SENTENCES).slice(0, 3);
  return `
  <div class="game-head">
    <button class="back" data-act="home">←</button>
    <div class="grow"><b>🎙 跟读对比</b><div style="font-size:12px;color:var(--ink2)">先听原声 → 跟读录音 → 回听对比</div></div>
  </div>
  ${list.map((s, i) => `
    <div class="card" style="margin-bottom:12px">
      <div style="font-size:17px;font-weight:700;line-height:1.5">${esc(s.en)}</div>
      <div class="ipa" style="font-size:12px;color:var(--ink2);margin-top:6px">${esc(s.ipa)}</div>
      <div style="font-size:12px;color:var(--pink);font-weight:700;margin-top:4px">重点音：${esc(s.focus)}</div>
      <div class="btn-row" style="margin-top:12px">
        <button class="btn ghost" data-act="speak" data-text="${esc(s.en)}">🔊 原声</button>
        <button class="btn ghost" data-act="speak" data-text="${esc(s.en)}" data-slow="1">🐢 慢速</button>
      </div>
      <div class="rec">
        <button class="rec-btn" data-act="rec" data-i="${i}">🎙</button>
        <div id="rec-box-${i}"></div>
      </div>
    </div>`).join('')}
  <p class="tip">英式要点：词尾 r 不卷舌（car /kɑː/），弱读音节一律轻读成 /ə/。</p>`;
};
ACT.shadow = () => go('shadow');

let recState = { rec: null, chunks: [], stream: null };
ACT.rec = async (d, el) => {
  const i = d.i, box = $('#rec-box-' + i);
  if (recState.rec && recState.rec.state === 'recording') {
    recState.rec.stop(); el.classList.remove('recording'); return;
  }
  if (!navigator.mediaDevices || !window.MediaRecorder) {
    box.innerHTML = '<div style="font-size:12px;color:var(--ink2)">当前环境不支持录音（需 https 或 localhost）。可改用手机自带录音机，再与原声对比。</div>';
    return;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const rec = new MediaRecorder(stream);
    recState = { rec, chunks: [], stream };
    rec.ondataavailable = e => recState.chunks.push(e.data);
    rec.onstop = () => {
      const url = URL.createObjectURL(new Blob(recState.chunks));
      box.innerHTML = `<audio controls src="${url}"></audio><div style="font-size:12px;color:var(--ink2)">← 点播放回听，再点上方原声对比</div>`;
      recState.stream.getTracks().forEach(t => t.stop());
      el.classList.remove('recording');
    };
    rec.start();
    el.classList.add('recording');
    box.innerHTML = '<div class="timer-num">录音中… 3 秒后自动停止</div>';
    setTimeout(() => { if (rec.state === 'recording') rec.stop(); }, 3000);
  } catch (err) {
    box.innerHTML = '<div style="font-size:12px;color:var(--ink2)">麦克风被拒绝或不可用：' + esc(err.name || '') + '</div>';
  }
};

/* ================= 启动 ================= */
render();

</script>
